<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Twin · Run Monitor</title>
<style>
:root{color-scheme:dark;--bg:#101517;--panel:#1a2225;--line:#2d3b3e;--muted:#8da19e;--accent:#65d1b2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e2ece9;font:14px Segoe UI,system-ui,sans-serif}header{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}small,.muted{color:var(--muted)}main{padding:18px;display:grid;grid-template-columns:minmax(400px,1.5fr) minmax(280px,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.view{width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:#14191c;border-radius:7px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;background:#151c1e;border-radius:7px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;font-size:20px;margin-top:6px;font-weight:550}.wide{grid-column:1/-1}canvas{width:100%;height:180px}.joints{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:8px}.joint{display:flex;justify-content:space-between;font:12px ui-monospace,monospace;color:#bacac5}.tag{border:1px solid var(--line);padding:6px 10px;border-radius:20px;color:var(--accent)}@media(max-width:850px){main{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><h1>Robot Twin <small>· PPO balance run</small></h1><span class="tag" id="status">Waiting for telemetry</span></header><main>
<section class="panel"><h2>MuJoCo overview</h2><img class="view" id="view" alt="Latest captured robot simulation frame"><p class="muted">A live snapshot is captured periodically. Evaluation replays are saved as MP4 videos.</p></section>
<section class="panel"><h2>Run state</h2><div class="metrics"><div class="metric"><span>Training steps</span><b id="step">—</b></div><div class="metric"><span>Reward</span><b id="reward">—</b></div><div class="metric"><span>Upright score</span><b id="upright">—</b></div><div class="metric"><span>Root height</span><b id="height">—</b></div><div class="metric"><span>Mass scale</span><b id="mass">—</b></div><div class="metric"><span>Friction</span><b id="friction">—</b></div></div></section>
<section class="panel wide"><h2>Recent episode returns</h2><canvas id="chart" width="1000" height="220"></canvas></section>
<section class="panel wide"><h2>Joint positions (radians)</h2><div class="joints" id="joints"></div></section></main>
<script>
const $=id=>document.getElementById(id),names=['waist_yaw','waist_pitch','neck_yaw','neck_pitch','left_hip_yaw','left_hip_roll','left_hip_pitch','left_knee_pitch','left_ankle_pitch','left_ankle_roll','right_hip_yaw','right_hip_roll','right_hip_pitch','right_knee_pitch','right_ankle_pitch','right_ankle_roll','left_shoulder_yaw','left_shoulder_roll','left_shoulder_pitch','left_elbow_pitch','left_wrist_yaw','left_wrist_pitch','right_shoulder_yaw','right_shoulder_roll','right_shoulder_pitch','right_elbow_pitch','right_wrist_yaw','right_wrist_pitch'];
function draw(v){let c=$('chart'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.fillStyle='#151c1e';x.fillRect(0,0,w,h);let a=v.episode_returns||[];if(a.length<2)return;let lo=Math.min(...a),hi=Math.max(...a),d=Math.max(1,hi-lo);x.strokeStyle='#65d1b2';x.lineWidth=3;x.beginPath();a.forEach((n,i)=>{let px=18+i*(w-36)/(a.length-1),py=h-18-(n-lo)/d*(h-36);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
async function poll(){try{let v=await(await fetch('/api/state?'+Date.now())).json();$('step').textContent=(v.step||0).toLocaleString();$('reward').textContent=Number(v.reward||0).toFixed(2);$('upright').textContent=Number(v.upright||0).toFixed(3);$('height').textContent=(v.position?.[2]||0).toFixed(3)+' m';$('mass').textContent=Number(v.randomization?.mass_scale||1).toFixed(2)+'×';$('friction').textContent=Number(v.randomization?.friction||0).toFixed(2);$('status').textContent='Live · '+new Date().toLocaleTimeString();$('joints').innerHTML=(v.joint_angles||[]).map((n,i)=>`<div class="joint"><span>${names[i]||'joint '+i}</span><b>${Number(n).toFixed(3)}</b></div>`).join('');draw(v.episode_returns||[]);$('view').src='/latest.png?'+Date.now()}catch(e){$('status').textContent='Waiting for training'}setTimeout(poll,1500)}setTimeout(()=>{$('view').src='/latest.png?'+Date.now()},3000);poll();
</script></body></html>
