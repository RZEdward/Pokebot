<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Hitmonlee-inspired robot proportion study</title><desc id="desc">Front and side silhouette study of a one and a half metre Hitmonlee-inspired humanoid robot, with character-color shell, spring-like leg bands and visible rotary joints. Not for manufacturing.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#202523"/><stop offset="1" stop-color="#111614"/></linearGradient>
  <linearGradient id="shell" x1="0" x2="1" y2=".5"><stop stop-color="#9c774e"/><stop offset=".48" stop-color="#d5b17d"/><stop offset="1" stop-color="#ad885b"/></linearGradient>
  <linearGradient id="lightShell" x1="0" x2="1"><stop stop-color="#b9a27d"/><stop offset=".52" stop-color="#ead8ae"/><stop offset="1" stop-color="#b8a47f"/></linearGradient>
  <linearGradient id="shorts" x1="0" x2="1"><stop stop-color="#4f252b"/><stop offset=".5" stop-color="#8e4145"/><stop offset="1" stop-color="#55292f"/></linearGradient>
  <radialGradient id="joint"><stop stop-color="#9fa39a"/><stop offset=".42" stop-color="#454b48"/><stop offset=".8" stop-color="#242a28"/><stop offset="1" stop-color="#777a70"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d4dfcf" stroke-opacity=".055" stroke-width="1"/></pattern>
  <filter id="shadow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="13"/></filter>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#ebe9dd}.muted{fill:#aeb8ae}.tiny{font-size:11px;letter-spacing:1.3px}.label{font-size:14px;letter-spacing:1.5px}.head{font-size:32px;font-weight:650;letter-spacing:-1px}.rule{stroke:#859187;stroke-opacity:.5;stroke-width:1}.call{stroke:#c8b18a;stroke-width:1;fill:none}.shell{fill:url(#shell);stroke:#f0d7a5;stroke-opacity:.5;stroke-width:2}.light{fill:url(#lightShell);stroke:#f1e4c9;stroke-opacity:.6;stroke-width:2}.short{fill:url(#shorts);stroke:#bf7777;stroke-opacity:.6;stroke-width:2}.metal{fill:url(#joint);stroke:#b5b7ad;stroke-opacity:.75;stroke-width:2}.band{fill:#d7c7a5;stroke:#eee1c4;stroke-opacity:.5;stroke-width:1.5}.dark{fill:#202726;stroke:#737b73;stroke-width:2}.eye{fill:#141b1a;stroke:#c39a54;stroke-width:2}
  </style>
</defs>
