<text x="1100" y="303" font-size="16">01  Long leg-to-body ratio</text><text x="1124" y="326" class="muted" font-size="12">Silhouette first; details later.</text>
<text x="1100" y="374" font-size="16">02  Tan shell / burgundy hips</text><text x="1124" y="397" class="muted" font-size="12">Signature color blocks.</text>
<text x="1100" y="445" font-size="16">03  Pale segmented leg bands</text><text x="1124" y="468" class="muted" font-size="12">Hint at elastic spring motion.</text>
<text x="1100" y="516" font-size="16">04  Grounded three-toe foot</text><text x="1124" y="539" class="muted" font-size="12">Replaceable sole; toe shells visual only.</text>
